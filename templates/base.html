<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lecture Recorder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  {% block extrahead %}{% endblock %}
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block extrascripts %}{% endblock %}
</head>
<body>
  <header class="lr-topbar">
    <div class="lr-topbar__inner">
      <a class="lr-topbar__brand" href="{{ url_for('ui_index') }}">
        <span class="lr-topbar__brand-dot"></span>
        Lecture Recorder
      </a>

      <div class="lr-topbar__datetime" id="lr-datetime" aria-live="off">
        <span class="lr-num">—</span>
      </div>

      <nav class="lr-topbar__nav" aria-label="Primary">
        <a href="{{ url_for('ui_index') }}"
           class="{% if request.endpoint == 'ui_index' %}is-active{% endif %}">Recs</a>
        <a href="/notes"
           class="{% if request.endpoint and request.endpoint.startswith('ui_notes') %}is-active{% endif %}">Notes</a>
        <a href="/todos"
           class="{% if request.endpoint and request.endpoint.startswith('ui_todos') %}is-active{% endif %}">Todos</a>
        <a href="/calendar"
           class="{% if request.endpoint and request.endpoint.startswith('ui_calendar') %}is-active{% endif %}">Calendar</a>
        <a class="lr-topbar__upload" href="{{ url_for('ui_upload') }}">↑ Upload</a>
        {% if unsorted_count and unsorted_count > 0 %}
          <a class="lr-topbar__unsorted" href="/unsorted" title="Recordings needing classification">
            <span class="lr-topbar__unsorted-dot"></span>
            <span class="lr-num">{{ unsorted_count }}</span>
          </a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    // Live-updating local date/time in the top bar.
    (function () {
      var el = document.getElementById("lr-datetime");
      if (!el) return;
      function fmt() {
        var d = new Date();
        var day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
        var hh = String(d.getHours()).padStart(2, "0");
        var mm = String(d.getMinutes()).padStart(2, "0");
        var dom = d.getDate();
        var mon = ["Jan","Feb","Mar","Apr","May","Jun",
                   "Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
        return day + " " + hh + ":" + mm + " \u00b7 " + dom + " " + mon;
      }
      function tick() { el.textContent = fmt(); }
      tick();
      setInterval(tick, 30 * 1000);
    })();
  </script>
</body>
</html>
